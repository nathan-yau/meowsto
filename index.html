<body class="locked">
<div id="lockscr">
  <div class="lockcard">
    <div id="lock-art" class="lock-art" aria-hidden="true">
      <span class="lock-sparkles" aria-hidden="true"></span>
      <img src="assets/meowsto-logo-256.png?v=ui20261015m" alt="">
    </div>
    <h1 class="lock-title">Meowsto</h1>
    <p class="sub">Your journal is encrypted on this device before upload — the server can’t read it.</p>
    <div class="seg" id="lmode" role="tablist" aria-label="Account mode">
      <button type="button" data-m="login" class="on" role="tab" aria-selected="true">Log in</button>
      <button type="button" data-m="reg" role="tab" aria-selected="false">Sign up</button>
    </div>
    <form id="uf">
      <label class="field">
        <span class="field-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19.2c1.6-3.2 4-4.8 6.5-4.8s4.9 1.6 6.5 4.8"/></svg>
        </span>
        <input id="un" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username" aria-label="Username">
      </label>
      <label class="field">
        <span class="field-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/><circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"/></svg>
        </span>
        <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
      </label>
      <div class="signup-fields" id="signup-fields" aria-hidden="true">
        <div class="signup-fields-inner">
          <label class="field">
            <span class="field-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="4.5" y="11" width="15" height="10" rx="2.5"/><path d="M12 15v2.5"/></svg>
            </span>
            <input id="code" type="text" autocomplete="off" autocapitalize="none" placeholder="Invite code" aria-label="Invite code" tabindex="-1">
          </label>
          <label class="ack"><input id="ack" type="checkbox" tabindex="-1"><span>I understand my password is the decryption key: <b>if I forget it, my data is gone forever</b> and nobody can reset it.</span></label>
        </div>
      </div>
      <label class="remember"><input id="rem" type="checkbox" checked><span>Remember me on this device</span></label>
      <button id="go" class="btn pri" type="submit">Log in →</button>
    </form>
    <div id="umsg" class="umsg"></div>
  </div>
</div>

<div id="app" class="app" hidden>
  <header>
    <div class="brand">
      <div id="brand-art"><img src="assets/meowsto-logo-256.png?v=ui20261015m" alt="Meowsto logo"></div>
      <div>
        <h1 class="app-name" data-app-name>Meowsto</h1>
        <p class="app-tagline">Good Food, Good Days <span class="leaf" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="#9cc08a" stroke="#5b8a63" stroke-width="1.5" stroke-linejoin="round"><path d="M12 20c0-6 3-10 9-11-1 6-4 9-9 9"/><path d="M12 20c0-4-2-7-8-8 .5 4 3 6.5 8 6.5" fill="#b8d4a6"/></svg></span></p>
      </div>
    </div>
    <div class="sync" id="sync" hidden></div>
    <button class="avatar" data-action="profile" aria-label="Profile"></button>
  </header>
  <nav class="tabs" aria-label="Journal views">
    <button data-tab="map">🗺️ <span>Map</span></button>
    <button data-tab="timeline">▣ <span>Timeline</span></button>
    <button data-tab="wishlist">♡ <span>Wishlist</span></button>
  </nav>
  <div class="tab-spacer" aria-hidden="true"></div>
  <main id="main"></main>
</div>

<div id="panel" class="panel" hidden aria-hidden="true">
  <div class="panel-inner">
    <div class="handle panel-handle" aria-hidden="true"></div>
    <div class="panel-head">
      <h2 id="panel-title"></h2>
    </div>
    <div id="modal" class="panel-body"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script>(function(){var m=document.querySelector("meta[name=theme-color]");function s(){m.content=document.body.classList.contains("locked")?"#e3eedf":"#ebf4e9";}s();new MutationObserver(s).observe(document.body,{attributes:true,attributeFilter:["class"]});})();</script>
